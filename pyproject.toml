[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "preservednv-sts2"
version = "0.1.0"
description = "Multi-interval non-verbal preservation for OmniVoice, with optional PretrainedSED detection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "PreservedNV-STS2 contributors" }]
dependencies = []

[project.optional-dependencies]
example = ["datasets>=3", "soundfile>=0.12"]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/nv_fix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
